<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Clock & Background Color Changer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #212121;
      color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: background-color 0.5s ease;
    }

    #title {
      cursor: pointer;
      font-size: 2rem;
      user-select: none;
      transition: color 0.5s ease;
    }

    #currentTime {
      font-size: 1.2rem;
      font-family: monospace;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
    }

    .btn-container {
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:active {
      transform: scale(0.96);
    }

    #start {
      background-color: #2e7d32;
      color: #ffffff;
    }

    #start:hover {
      background-color: #1b5e20;
    }

    #stop {
      background-color: #d32f2f;
      color: #ffffff;
    }

    #stop:hover {
      background-color: #b71c1c;
    }
  </style>
</head>
<body>

  <h1 id="title">Click Me or Press Start</h1>
  <div id="currentTime"></div>

  <div class="btn-container">
    <button id="start">Start</button>
    <button id="stop">Stop</button>
  </div>

  <!-- Loads compiled JavaScript from script.ts -->
  <script type="module" src="../../../../dist/assignments/dom/ex3st/dom3.js"></script>
</body>
</html>
